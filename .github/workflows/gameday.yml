name: Gameday scores

# Scores only — never touches The Odds API, so this costs nothing against the
# 500-credit free tier. ESPN's scoreboard is unauthenticated and unmetered.
# The hourly sync.yml still runs and remains the one that refreshes DK lines.
#
# Cron is UTC and does NOT follow US daylight saving, so each window is widened
# to cover both EDT (UTC-4) and EST (UTC-5).
on:
  schedule:
    # Thu afternoon — Thanksgiving / Christmas slates (12:30 PM ET = 16:30/17:30 UTC)
    - cron: '*/10 16-23 * * 4'
    # Thursday Night Football (8:15 PM ET Thu = 00:15/01:15 UTC Fri)
    - cron: '*/10 0-5 * * 5'
    # Late-season Saturday games
    - cron: '*/10 17-23 * * 6'
    - cron: '*/10 0-5 * * 0'
    # Sunday slate, London kickoff (9:30 AM ET) through the 4pm window
    - cron: '*/10 13-23 * * 0'
    # Sunday Night Football tail (ends ~11:45 PM ET = 03:45/04:45 UTC Mon)
    - cron: '*/10 0-5 * * 1'
    # Monday Night Football (8:15 PM ET Mon = 00:15/01:15 UTC Tue)
    - cron: '*/10 0-5 * * 2'
  workflow_dispatch:

# Share sync.yml's concurrency group so two jobs never write scores at once.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Season gate
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          m=$(date -u +%-m)
          if [ "$m" -ge 3 ] && [ "$m" -le 8 ]; then
            echo "Offseason (month $m) — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22

      - name: Sync scores
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_ODDS: 'never'
          SYNC_SCORES: 'always'
        run: node scripts/sync.mjs
