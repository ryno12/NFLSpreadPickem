name: Sync lines & scores

on:
  schedule:
    - cron: '7 * * * *'        # hourly at :07 UTC. Scores every run; lines every 4th hour.
  workflow_dispatch:
    inputs:
      odds:
        description: 'Pull odds this run? (always / auto / never)'
        default: 'always'
        required: false

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SYNC_ODDS: ${{ github.event.inputs.odds || 'auto' }}
          ODDS_EVERY_HOURS: '4'
        run: node scripts/sync.mjs
